    Experience:
      - company: CTI Diophantus — EN (POLLA) PLO
        logo: /assets/img/cv/cti.png
        position: ML Researcher
        location: Patras, Greece
        start_date: 2026-02-01
        end_date: present
        highlights:
          - Research contract developing ML/DL systems to optimize Greece's nationwide school textbook distribution ecosystem under the new multiple-textbook policy.
          - Predictive models for student population, textbook demand, and inventory forecasting; school clustering by textbook selection patterns; simulation of logistics and what-if supply-chain scenarios; integration of the developed tools into the Publications Directorate IT infrastructure.
          - "Scientific Coordinator: Dr. Christos Manolopoulos"

      - company: University General Hospital of Patras — Dept. of Internal Medicine
        logo: /assets/img/cv/pgnp.png
        position: Research Scientist (Respiratory Infections)
        location: Rio, Greece
        start_date: 2025-11-01
        end_date: present
        highlights:
          - Supervised dataset curation, annotation workflows, and quality control for respiratory infection data (audio and imaging).
          - Multimodal deep-learning research combining paired lung sound recordings, chest X-rays, and inflammatory biomarkers to distinguish bacterial vs. viral pneumonia and identify clinically meaningful audio biomarkers.
          - Development of mobile and web-based clinical data acquisition tools for in-hospital deployment.
          - "Clinical collaborator: Prof. Dimitrios Velissaris"

      - company: University General Hospital of Patras — Dept. of Internal Medicine
        logo: /assets/img/cv/pgnp.png
        position: Research Scientist (Ocular Biomarkers)
        location: Rio, Greece
        start_date: 2024-01-01
        end_date: present
        highlights:
          - Supervised curation, annotation, and quality control of ocular images for jaundice assessment.
          - Statistical and causal modeling of digital biomarkers and hematological indicators in patients diagnosed with jaundice.
          - Study conducted under institutional ethics committee approval (University General Hospital of Patras IRB).
          - "Clinical collaborator: Prof. Dimitrios Velissaris"

      - company: Pfizer CDI — EyeAI Research Project
        logo: /assets/img/cv/pfizer.png
        position: Research Scientist
        location: Thessaloniki, Greece
        start_date: 2024-01-01
        end_date: 2025-10-01
        highlights:
          # - Externally funded Pfizer CDI contract awarded to University of Patras after competitive proposal.
          - Supervised dataset curation, annotation workflows, and quality control for ocular imaging.
          - Developed an attention-gated UNet++ architecture for automatic sclera segmentation from smartphone-captured eye images.
          - Quantized and deployed the model on-device for real-time smartphone inference (TensorFlow Lite / ONNX).

      - company: Pfizer CDI — Voice-Based Diagnostics (VBD-2)
        logo: /assets/img/cv/pfizer.png
        position: Research Scientist
        location: Thessaloniki, Greece
        start_date: 2023-01-01
        end_date: 2024-09-01
        highlights:
          - Designed and deployed an end-to-end, on-device AI pipeline for continuous, passive respiratory screening with real-time cough detection and disease analysis.
          - Processed 10-second tracheal and chest-wall auscultation recordings from the built-in microphone, with percussive noise removal and frequency-spectrum correction to mitigate domain shift across auscultation sites and microphone devices, for asthma and COPD detection.
          - Developed a ResNet-34 classifier with probabilistic voting for disease identification, plus deep generative models for cough and lung-sound synthesis to address training-data scarcity.

      - company: EU Horizon SynAir-G
        logo: /assets/img/cv/synair-g.png
        position: Research Scientist
        location: Patras, Greece
        start_date: 2022-09-01
        end_date: present
        highlights:
          - "*Disrupting Noxious Synergies of Indoor Air Pollutants and their Impact in Childhood Health and Wellbeing, using Advanced Intelligent Multisensing and Green Interventions* (Grant Agreement No. 101057271)."
          - Investigation of synergistic interactions between indoor air quality metrics and physiological signals from wearable devices using multivariate and temporal causal models.
          - "Scientific Coordinator: Prof. Nikos Papadopoulos"

      - company: Pfizer CDI — Voice-Based Diagnostics (VBD-1)
        logo: /assets/img/cv/pfizer.png
        position: Research Scientist
        location: Thessaloniki, Greece
        start_date: 2022-01-01
        end_date: 2023-08-01
        highlights:
          - Cough detection algorithms and abnormal/normal lung sound classifiers deployed for real-time smartphone inference using the built-in microphone.

    Teaching:
      - bullet: "**Guest Lecturer — AI Algorithms and Applications for IoT** (Spring 2026). University of Patras, Dept. of Computer Engineering & Informatics; course coordinator Prof. Sotiris Nikoletseas. Designed and taught a six-lecture applied ML module on IoT time-series data, and prepared all materials: slides, Python demos, and a graded end-to-end project on the PAMAP2 activity recognition dataset."
      - bullet: "**Lab Instructor — Analog Electronics Laboratory** (Sep 2021 – Jan 2022). University of Patras; supervisor Dr. Georgios Oikonomou. Guided undergraduates through hands-on analog circuit experiments, theory sessions, and result analysis."
